# REHOTEQ Field — test, then publish to field.rehoteq.com
#
# Pages source must be set to "GitHub Actions" (Settings -> Pages -> Source).
#
# Deploy only happens if the tests pass. If a change breaks the app, GitHub
# refuses to publish it and the phones in the field keep the last good build.
name: Test and deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race each other.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - name: Run the suite
        run: npm test

  deploy:
    name: Deploy to GitHub Pages
    needs: test
    # Pull requests get tested but must never publish.
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # Publish only what the app needs. Specs, tests and the schema stay in
      # the repo but are not served.
      - name: Assemble the site
        run: |
          mkdir -p _site
          for f in index.html 404.html admin.html admin.js config.js icons.js firebase.js \
                   app.js data.js db.js pdf.js zip.js qr.js report.js styles.css \
                   sw.js manifest.webmanifest icon-192.png icon-512.png CNAME privacy.html; do
            if [ -f "$f" ]; then
              cp "$f" _site/
            else
              echo "::error::missing required file $f"; exit 1
            fi
          done
          mkdir -p _site/.well-known
          cp .well-known/assetlinks.json _site/.well-known/
          echo "Published files:"; ls -la _site

      # Firebase "Option 4" same-site sign-in: mirror Firebase's /__/ helper
      # onto field.rehoteq.com so the Google redirect hand-off runs first-party.
      # The extensionless pages (auth/handler, auth/iframe, auth/links) MUST be
      # saved as .html: GitHub Pages serves an extensionless file as an
      # application/octet-stream download, whereas it serves /__/auth/handler
      # as text/html from _site/__/auth/handler.html.
      - name: Fetch Firebase sign-in helper
        run: |
          set -euo pipefail
          BASE="https://rehoteq-field.firebaseapp.com/__"
          mkdir -p _site/__/auth _site/__/firebase

          fetch_req() {
            curl -fsSL --retry 3 "$BASE/$1" -o "_site/__/$2"
          }
          fetch_opt() {
            if ! curl -fsSL --retry 3 "$BASE/$1" -o "_site/__/$2"; then
              echo "::warning::optional $BASE/$1 not available; skipping"
              rm -f "_site/__/$2"
            fi
          }

          fetch_req auth/handler        auth/handler.html
          fetch_req auth/handler.js     auth/handler.js
          fetch_req auth/experiments.js auth/experiments.js
          fetch_req auth/iframe         auth/iframe.html
          fetch_req auth/iframe.js      auth/iframe.js
          if ! curl -fsSL --retry 3 "$BASE/firebase/init.json" -o "_site/__/firebase/init.json"; then
            echo "::notice::$BASE/firebase/init.json returned 404 (no Firebase Hosting deploy); building firebase/init.json from config.js"
            node -e '
              const f = require("./config.js").firebase;
              const init = {
                apiKey: f.apiKey,
                authDomain: f.authDomain,
                projectId: f.projectId,
                storageBucket: f.storageBucket,
                messagingSenderId: f.messagingSenderId,
                appId: f.appId
              };
              require("fs").writeFileSync("_site/__/firebase/init.json", JSON.stringify(init, null, 2) + "\n");
            '
          fi

          fetch_opt auth/links          auth/links.html
          fetch_opt auth/links.js       auth/links.js

          grep -q '<script' _site/__/auth/handler.html
          grep -q '<script' _site/__/auth/iframe.html
          test "$(jq -r '.projectId' _site/__/firebase/init.json)" = "rehoteq-field"
          ls -la _site/__/auth _site/__/firebase

      - uses: actions/configure-pages@v5
        # Tries to switch Pages on by itself using this workflow's token, so
        # the repo does not have to be prepared by hand first. If your account
        # does not permit that, do it once in the browser:
        # Settings -> Pages -> Source -> GitHub Actions.
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4

      - name: Smoke-test same-site sign-in
        run: |
          set -euo pipefail
          check_endpoint() {
            local path="$1" want_type="$2"
            local attempt
            for attempt in $(seq 1 18); do
              local url="https://field.rehoteq.com${path}?cb=$(date +%s)-${attempt}"
              local meta code ctype
              meta=$(curl -sS -o /dev/null -w '%{http_code} %{content_type}' "$url" || true)
              code="${meta%% *}"
              ctype="${meta#* }"
              if [ "$code" = "200" ] && echo "$ctype" | grep -qi "$want_type"; then
                echo "OK $path -> HTTP $code ($ctype) on attempt $attempt"
                return 0
              fi
              echo "Attempt $attempt/18: $path returned HTTP $code ($ctype); retrying in 10s..."
              sleep 10
            done
            echo "::error::Smoke test failed for https://field.rehoteq.com${path} (expected 200 + $want_type)"
            return 1
          }
          failed=0
          check_endpoint "/__/auth/handler"       "text/html" || failed=1
          check_endpoint "/__/auth/iframe"        "text/html" || failed=1
          check_endpoint "/__/firebase/init.json" "json"      || failed=1
          [ "$failed" -eq 0 ]
          echo "::notice title=SmokeTest::Same-site sign-in endpoints verified (/__/auth/handler, /__/auth/iframe, /__/firebase/init.json)"
